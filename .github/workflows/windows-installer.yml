name: Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download ADB
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath .

      - name: Build one-file exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name PhoneElementInspector `
            --add-data "demo;demo" `
            --add-data "data;data" `
            --add-binary "platform-tools/adb.exe;." `
            --add-binary "platform-tools/AdbWinApi.dll;." `
            --add-binary "platform-tools/AdbWinUsbApi.dll;." `
            --collect-all customtkinter `
            --collect-all uiautomator2 `
            --collect-all adbutils `
            --collect-all PIL `
            --hidden-import PIL._tkinter_finder `
            --hidden-import lxml.etree `
            main.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Phone Element Inspector
          make_latest: "true"
          overwrite_files: true
          body: |
            Download PhoneElementInspector.exe and double-click it.
            Nothing else to install. ADB is inside the exe.
            Plug the phones in with USB debugging on.
            Drag the top bar to move the window. X closes it.
            Click an element to select it. The mirror picture updates on its own.
            Element boxes update only when the screen actually changes.
            Saved tags and rules stay in a data folder next to the exe.
          files: dist/PhoneElementInspector.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
